services:
  - type: web
    name: pyide
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && npm ci && npm run build
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: pyide
